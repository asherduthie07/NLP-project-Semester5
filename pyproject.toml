[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codeatlas-ai"
version = "0.1.0"
description = "Traceable source collection and lexical preprocessing for Python and Java"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.162.0", "uvicorn==0.54.0", "pydantic==2.14.2", "pydantic-settings==2.16.2",
  "SQLAlchemy==2.1.6", "alembic==1.20.1", "psycopg[binary]==3.3.6", "celery==5.6.3",
  "redis==8.1.0", "httpx==0.28.1", "python-multipart==0.0.33",
  "tree-sitter==0.25.2", "tree-sitter-python==0.25.0", "tree-sitter-java==0.23.5",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-cov==7.1.0", "hypothesis==6.170.14", "ruff==0.17.3", "httpx2==2.16.0"]

[tool.setuptools.packages.find]
include = ["backend*", "analyzers*", "workers*", "nlp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["postgres: requires CODEATLAS_TEST_DATABASE_URL", "worker: requires live Redis and worker"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
